name: Recovery Builder - TWRP

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/cd-Crypton/custom_recovery_tree_realme_macedonia'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'twrp-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/oneplus/avalon'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'avalon'

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WORK_DIR: /mnt/work
    permissions:
      contents: write

    steps:
    - name: Check Out
      uses: actions/checkout@v4

    # ✅ MAX DISK SPACE + USE /mnt
    - name: Maximize Build Space
      run: |
        echo "Before cleanup"
        df -h

        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/local/.ghcup
        sudo apt clean

        sudo mkdir -p /mnt/work
        sudo chown $USER:$USER /mnt/work

        echo "After cleanup"
        df -h

    - name: Display Inputs
      run: |
        echo "Device Tree: ${{ inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ inputs.DEVICE_NAME }}"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
          linux-modules-extra-$(uname -r) gperf gcc-multilib g++-multilib \
          libc6-dev lib32ncurses-dev libx11-dev lib32z-dev libxml2-utils \
          bc ccache libncurses-dev libsdl1.2-dev build-essential git \
          squashfs-tools imagemagick libstdc++-10-dev python3 tar

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install Git-Repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize Repo
      run: |
        mkdir -p $WORK_DIR/android-recovery
        cd $WORK_DIR/android-recovery
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        repo init --depth=1 -u https://github.com/EternalMikaelson/twrp-manifest.git -b twrp-16.0

    - name: Repo Sync
      run: |
        cd $WORK_DIR/android-recovery
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch -j$(nproc --all) --force-sync

    - name: Clone Device Tree
      run: |
        cd $WORK_DIR/android-recovery
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}

    - name: Telegram - Build Started
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TG_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="😈 TWRP buildbot started%0A📱 Device: ${{ inputs.DEVICE_NAME }}%0A🕒 Time: $(date)"

    - name: Build Recovery
      run: |
        cd $WORK_DIR/android-recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true

        # Prevent GitHub OOM kill
        export NINJA_ARGS="-j$(nproc --all) -l$(nproc --all)"

        lunch twrp_${{ inputs.DEVICE_NAME }}

        m recoveryimage

    - name: Set Build Properties
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          /mnt/work/android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.*
        name: Unofficial TWRP for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}

    - name: Telegram - Build Completed
      if: success()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TG_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="✅ TWRP buildbot finished%0A📱 Device: ${{ inputs.DEVICE_NAME }}"

    - name: Telegram - Build Failed
      if: failure()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TG_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="💥 TWRP buildbot failed%0A📱 Device: ${{ inputs.DEVICE_NAME }}%0A❌ Check GitHub logs"
